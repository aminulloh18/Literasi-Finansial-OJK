<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kuis Diskon Detektif</title>
<style>
:root{--bg:#0F172A;--c:#1E293B;--t:#F8FAFC;--m:#94A3B8;--a:#F59E0B;--g:#10B981;--r:#F43F5E}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:16px/1.45 system-ui,sans-serif}
#app{max-width:640px;margin:0 auto;padding:16px}#app.wide{max-width:900px}
.card{background:var(--c);border:2px solid #334155;border-radius:16px;padding:18px;margin:12px 0}
h1,h2{margin:.2em 0;color:var(--a)}
input,select,textarea{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:2px solid #334155;background:var(--bg);color:var(--t);font:inherit}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 16px;background:var(--a);color:#0F172A;cursor:pointer}
button.s{background:#334155;color:var(--t)}button.d{background:var(--r);color:#fff}button:disabled{opacity:.5}button:focus-visible,input:focus-visible{outline:3px solid #fff}
.opts{display:grid;gap:10px}.o{display:flex;gap:10px;align-items:center;text-align:left;color:#fff;padding:16px}.o b{background:#0006;border-radius:8px;padding:2px 10px}
.o0{background:#2563EB}.o1{background:#D97706}.o2{background:#7C3AED}.o3{background:#059669}.o.me{outline:4px solid #fff}
.bar{height:10px;background:#334155;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--a)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>button{flex:1}.m{color:var(--m);font-size:14px}.big{font-size:22px;font-weight:700}
table{width:100%;border-collapse:collapse}td{padding:8px;border-bottom:1px solid #334155}
</style></head><body><main id="app"></main>
<script>
const API='GANTI_DENGAN_URL_WEB_APP_/exec';
const $=id=>document.getElementById(id),app=$('app'),L='ABCD';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(a,d={}){const r=await fetch(API,{method:'POST',body:JSON.stringify({a,...d})});const j=await r.json();if(!j.ok)throw new Error(j.err);return j}
let S=JSON.parse(localStorage.getItem('kuis')||'{}'),T=null,P=null,off=0,key='';
const save=()=>localStorage.setItem('kuis',JSON.stringify(S)),err=e=>alert(e.message||e),stop=()=>{clearInterval(T);clearTimeout(P)};
function timer(t0,dur,end){const e=t0+dur*1000,f=()=>{const l=(e-(Date.now()+off))/1000;$('tm').textContent=Math.max(0,Math.ceil(l));$('tb').style.width=Math.max(0,l/dur*100)+'%';if(l<=0){clearInterval(T);end()}};f();T=setInterval(f,250)}
function qView(q,dur,t0,total,pick){app.innerHTML=`<div class=row><span class=m>Soal ${q.no} dari ${total}</span><span class=big id=tm style="margin-left:auto"></span></div><div class=bar><i id=tb></i></div><div class=card><div class=big>${esc(q.q)}</div></div><div class=opts>${q.o.map((o,x)=>o?`<button class="o o${x}" data-l="${L[x]}"><b>${L[x]}</b>${esc(o)}</button>`:'').join('')}</div><p id=msg class=m></p>`;
 let done=false;const send=async l=>{if(done)return;done=true;document.querySelectorAll('.o').forEach(b=>{b.disabled=true;if(b.dataset.l==l)b.classList.add('me')});try{await pick(l)}catch(e){if(!/Sudah|habis/.test(e.message))err(e)}};
 document.querySelectorAll('.o').forEach(b=>b.onclick=()=>send(b.dataset.l));timer(t0,dur,()=>send('-'))}
function resView(r,mine,next){const s=r.st,n=s.n||1,ok=mine==r.k;app.innerHTML=`<div class=card><div class=big style="color:${ok?'var(--g)':'var(--r)'}">${mine=='-'?'Waktu habis':ok?'Benar!':'Belum tepat'}${r.poin!=null?' · +'+r.poin+' poin':''}</div><p>Jawaban benar: <b>${r.k}</b></p><p class=m>${esc(r.x||'')}</p></div><div class=card><b>Hasil kelas: ${s.benar} benar · ${s.salah} salah</b>${[...L].map(l=>`<div class=m>${l}${l==r.k?' (benar)':''} · ${s[l]||0} siswa</div><div class=bar><i style="width:${(s[l]||0)/n*100}%"></i></div>`).join('')}</div>${next?'<button id=nx style="width:100%">Lanjut</button>':''}`;if(next)$('nx').onclick=next}
async function board(end){stop();try{const j=await api('lb',{pid:S.pid});app.innerHTML=`<h1>${end?'Klasemen Akhir':'Klasemen'}</h1><div class=card><table>${j.lb.map((r,i)=>`<tr${r.pid==S.pid?' style="color:var(--a)"':''}><td>${['🥇','🥈','🥉'][i]||i+1}</td><td>${esc(r.nama)}<div class=m>${esc(r.kelas)}</div></td><td>${r.benar} benar, ${r.salah} salah</td><td><b>${r.poin}</b></td></tr>`).join('')}</table></div>${j.me?`<div class=card>Peringkatmu: <b>#${j.me.rank}</b> dari ${j.n} siswa · ${j.me.poin} poin</div>`:''}`}catch(e){err(e)}}
async function mandiri(){stop();if(S.i>=S.total)return board(true);
 try{const j=await api('q',{pid:S.pid,i:S.i});off=j.now-Date.now();
  qView(j.q,j.dur,j.t0,S.total,async l=>{let r;try{r=await api('ans',{pid:S.pid,i:S.i,j:l})}catch(e){if(/Sudah/.test(e.message)){S.i++;save();return mandiri()}throw e}resView(r,l,()=>{S.i++;save();mandiri()})})}catch(e){err(e)}}
async function live(){clearTimeout(P);try{const j=await api('state',{pid:S.pid});off=j.now-Date.now();const k=j.phase+j.qi;if(k!=key){key=k;lview(j)}}catch(e){if(/gabung lagi|tidak dikenal/.test(e.message)){localStorage.removeItem('kuis');S={};return joinView('')}}P=setTimeout(live,2500)}
function lview(j){clearInterval(T);
 if(j.phase=='question')qView(j.q,j.dur,j.openAt,j.total,async l=>{await api('ans',{pid:S.pid,j:l});$('msg').textContent=l=='-'?'Waktu habis':'Jawaban terkirim, menunggu hasil...'});
 else if(j.phase=='result')resView(j.res,j.res.j,null);
 else if(j.phase=='board'||j.phase=='end')board(j.phase=='end');
 else app.innerHTML=`<div class=card><h2>Menunggu guru memulai...</h2><p>Halo, ${esc(S.nama)}! Siapkan kalkulatormu.</p></div>`}
function joinView(k){app.innerHTML=`<h1>Kuis Diskon Detektif</h1><div class=card><input id=n placeholder="Nama lengkap" autocomplete=off><input id=k2 placeholder="Kelas, contoh X-1"><input id=c placeholder="Kode sesi" inputmode=numeric value="${esc(k)}"><button id=go style="width:100%">Gabung</button></div>`;
 $('go').onclick=async()=>{try{const j=await api('join',{nama:$('n').value,kelas:$('k2').value,kode:$('c').value});S={pid:j.pid,mode:j.mode,total:j.total,nama:j.nama,i:0};save();key='';j.mode=='live'?live():mandiri()}catch(e){err(e)}}}
async function home(){const k=new URLSearchParams(location.search).get('kode')||'';if(S.pid){try{await api('lb',{pid:S.pid});return S.mode=='live'?live():mandiri()}catch(e){localStorage.removeItem('kuis');S={}}}joinView(k)}
/* ===== DASHBOARD GURU: buka kuis.html#guru ===== */
function csv(t){t=t.replace(/^\uFEFF/,'');const h=t.split(/\r?\n/)[0],d=h.includes('\t')?'\t':h.includes(',')?',':';',r=[];let row=[],c='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}else if(ch=='"')q=true;else if(ch==d){row.push(c);c=''}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;row.push(c);r.push(row);row=[];c=''}else c+=ch}row.push(c);r.push(row);return r.filter(x=>x.join('').trim())}
function dlf(n,t){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\uFEFF'+t],{type:'text/csv'}));a.download=n;a.click()}
async function guru(){let pin=sessionStorage.pin||'';const A=(a,d)=>api(a,{pin,...d});
 const login=()=>{app.innerHTML=`<h1>Dashboard Guru</h1><div class=card><input id=pn type=password placeholder="PIN guru"><button id=ok style="width:100%">Masuk</button></div>`;$('ok').onclick=async()=>{pin=$('pn').value;try{await A('a_info');sessionStorage.pin=pin;dash()}catch(e){err(e)}}};
 try{await A('a_info');dash()}catch(e){login()}
 function dash(){app.className='wide';const go=async(a,d)=>{try{await A(a,d);poll()}catch(e){err(e)}};
  app.innerHTML=`<h1>Dashboard Guru</h1>
<div class=card><b>1. Sesi kuis</b> <span id=ns class=m></span><select id=md><option value=live>Serentak: guru mengatur soal</option><option value=mandiri>Mandiri: siswa jalan sendiri</option></select><button id=st style="width:100%">Mulai sesi baru</button><div id=sx></div></div>
<div class=card id=ctl></div><div class=m id=jb></div>
<div class=card><b>2. Soal</b><textarea id=ta rows=4 placeholder="Tempel soal (CSV atau salin dari Google Sheets), atau pilih file CSV"></textarea><input type=file id=fl accept=".csv,.txt"><div class=row><button id=up>Unggah soal</button><button class=s id=tp>Unduh template</button></div><p class=m>Kolom: pertanyaan, A, B, C, D, kunci (A-D), detik, poin, penjelasan. Unggahan baru menimpa soal lama.</p></div>
<div class=card><b>3. Hasil</b><div class=row><button id=dl>Unduh rekap CSV</button><button class=d id=rs>Unduh, arsip, lalu hapus hasil</button><button class=d id=ds>Hapus soal</button></div></div>
<div class=card><b>Klasemen sementara</b><div id=lbx></div></div>`;
  $('st').onclick=()=>go('a_start',{mode:$('md').value});
  $('fl').onchange=e=>{const f=e.target.files[0];if(f)f.text().then(t=>$('ta').value=t)};
  $('up').onclick=async()=>{const r=csv($('ta').value),h=/^pertanyaan/i.test((r[0]||[''])[0])?1:0,rows=r.slice(h),bad=[];rows.forEach((x,i)=>{if(!x[0]||!x[1]||!x[2]||!/^[ABCD]$/i.test((x[5]||'').trim()))bad.push(i+1+h)});if(!rows.length||bad.length)return alert('Baris bermasalah: '+(bad.join(', ')||'kosong'));await go('a_setsoal',{rows});alert(rows.length+' soal tersimpan')};
  $('tp').onclick=()=>dlf('template-soal.csv','pertanyaan,A,B,C,D,kunci,detik,poin,penjelasan\n"Contoh soal, boleh memakai koma",Jawaban A,Jawaban B,Jawaban C,Jawaban D,B,30,100,Penjelasan singkat\n');
  $('dl').onclick=async()=>{const j=await A('a_rekap');dlf('rekap-kuis-'+new Date().toISOString().slice(0,10)+'.csv',[j.head,...j.rows].map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n'))};
  $('rs').onclick=async()=>{if(!confirm('Rekap akan diunduh, hasil diarsipkan ke tab baru di Google Sheet, lalu dikosongkan untuk kuis baru. Lanjut?'))return;await $('dl').onclick();await go('a_hapus',{what:'hasil',arsip:true})};
  $('ds').onclick=()=>confirm('Hapus semua soal?')&&go('a_hapus',{what:'soal'});
  const url=()=>location.origin+location.pathname,poll=async()=>{try{const j=await A('a_info'),s=j.st;$('ns').textContent='· '+j.total+' soal tersimpan';
   $('sx').innerHTML=s.sesi?`<p>Kode sesi: <span class=big>${s.kode}</span> · ${s.mode=='live'?'Serentak':'Mandiri'} · ${j.peserta} peserta</p><img alt="QR sesi" width=180 height=180 src="https://api.qrserver.com/v1/create-qr-code/?size=360x360&data=${encodeURIComponent(url()+'?kode='+s.kode)}"><p class=m>${url()}?kode=${s.kode}</p>`:'<p class=m>Belum ada sesi aktif.</p>';
   const k=s.sesi+s.phase+s.qi+j.total;if($('ctl').dataset.k!=k){$('ctl').dataset.k=k;const last=s.qi+1>=j.total;$('ctl').innerHTML=s.sesi&&s.mode=='live'?`<b>Kontrol serentak</b> <span class=m>${s.phase} · soal ${Math.max(s.qi+1,0)} dari ${j.total}</span><div class=row><button id=nx>${last?'Selesai, tampilkan klasemen akhir':'Buka soal '+(s.qi+2)}</button><button class=s id=cl>Tutup dan tampilkan hasil</button><button class=s id=bd>Tampilkan klasemen</button></div>`:'';
    if($('nx')){$('nx').onclick=()=>last?go('a_phase',{phase:'end'}):go('a_open',{i:s.qi+1});$('cl').onclick=()=>go('a_phase',{phase:'result'});$('bd').onclick=()=>go('a_phase',{phase:'board'})}}
   $('jb').textContent=s.phase=='question'?j.jawab+' dari '+j.peserta+' siswa sudah menjawab':'';
   $('lbx').innerHTML='<table>'+j.lb.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.nama)} <span class=m>${esc(r.kelas)}</span></td><td>${r.benar} benar, ${r.salah} salah</td><td><b>${r.poin}</b></td></tr>`).join('')+'</table>'}catch(e){}};
  poll();T=setInterval(poll,3000)}}
function route(){stop();app.className='';location.hash=='#guru'?guru():home()}
window.onhashchange=route;route();
</script></body></html>
