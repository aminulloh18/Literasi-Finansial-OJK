<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Kuis Diskon Detektif 3D</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--bg:#0F172A;--c:#1E293B;--t:#F8FAFC;--m:#94A3B8;--a:#F59E0B;--g:#10B981;--r:#F43F5E}
*{box-sizing:border-box}
body{
  margin:0;
  background:radial-gradient(1100px 600px at 15% -10%,#1e3a5f66,transparent),radial-gradient(900px 500px at 100% 0,#f59e0b26,transparent),var(--bg);
  color:var(--t);
  font:16px/1.45 system-ui,-apple-system,sans-serif;
  overflow-x:hidden;
  min-height:100vh;
}
#app{max-width:640px;margin:0 auto;padding:16px;position:relative;z-index:10}
#app.wide{max-width:1120px}
/* Grid layout khusus Dashboard Guru */
#app.wide:has(#ctl){display:grid;grid-template-columns:repeat(auto-fit,minmax(460px,1fr));gap:4px 20px;align-items:start}
#app.wide:has(#ctl)>h1,#app.wide:has(#ctl)>p{grid-column:1/-1}
#app.wide:has(#ctl)>h1{font-size:34px;font-weight:800;background:linear-gradient(90deg,#F59E0B,#FDE68A);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:0}
#app.wide:has(#ctl)>div:nth-of-type(2),#app.wide:has(#ctl)>div:nth-of-type(3){grid-column:1/-1}

.card{
  background:linear-gradient(160deg,#1E293Bf2,#172033f2);
  backdrop-filter:blur(8px);
  border:1px solid #33415588;
  border-left:4px solid var(--a);
  border-radius:16px;
  padding:18px;
  margin:10px 0;
  box-shadow:0 10px 30px #0006;
}
h1,h2{margin:.2em 0;color:var(--a)}
input,select,textarea{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #334155;background:#0b1120;color:var(--t);font:inherit;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--a);outline:none}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 16px;background:var(--a);color:#0F172A;cursor:pointer;transition:transform .12s,filter .12s,box-shadow .12s}
button:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.08);box-shadow:0 4px 12px #0004}
button:active:not(:disabled){transform:scale(.97)}
button.s{background:#334155;color:var(--t)}
button.d{background:var(--r);color:#fff}
button:disabled{opacity:.5;cursor:not-allowed}

.opts{display:grid;gap:10px}
.o{display:flex;gap:10px;align-items:center;text-align:left;color:#fff;padding:16px;border-radius:12px}
.o b{background:#0006;border-radius:8px;padding:2px 10px}
.o0{background:#2563EB}.o1{background:#D97706}.o2{background:#7C3AED}.o3{background:#059669}.o.me{outline:4px solid #fff}

.bar{height:10px;background:#334155;border-radius:9px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--a);transition:width .25s linear}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>button{flex:1}
.m{color:var(--m);font-size:14px}
.big{font-size:22px;font-weight:700}
#ph{background:#F59E0B22;color:#FBBF24;border:1px solid #F59E0B44;border-radius:99px;padding:2px 12px;font-weight:700;font-size:13px;margin-left:6px}

.two{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}
@media(max-width:600px){.two{grid-template-columns:1fr}#app.wide:has(#ctl){grid-template-columns:1fr}}

.it{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:10px 0;border-bottom:1px solid #33415588}
.it:last-child{border-bottom:none}
.it button{padding:6px 10px;font-size:13px}
.it .q{flex:1;min-width:180px}

table{width:100%;border-collapse:collapse}
td,th{padding:10px 8px;border-bottom:1px solid #33415588;text-align:left}
th{color:var(--a);font-size:13px;text-transform:uppercase;letter-spacing:.04em}
tr:nth-child(even) td{background:#ffffff06}

/* 3D UI Overlay & HUD Styles */
#game-ui{position:fixed;inset:0;pointer-events:none;z-index:5;display:none}
#hud{position:absolute;top:14px;left:14px;display:none;gap:8px;flex-wrap:wrap;pointer-events:auto;z-index:6}
.pill{background:#0F172Add;backdrop-filter:blur(6px);color:#FDE68A;border:1px solid #F59E0B88;border-radius:99px;padding:8px 14px;font-weight:700;font-size:14px;box-shadow:0 4px 12px #0005}
#start-screen{background:rgba(15,23,42,0.82);backdrop-filter:blur(4px);color:white;position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;align-items:center;pointer-events:auto;padding:40px 20px}
.char-selector{display:flex;align-items:center;gap:20px;background:rgba(0,0,0,0.6);border:1px solid #F59E0B66;padding:15px 30px;border-radius:50px;margin-bottom:20vh}
.char-btn{background:#F59E0B;color:black;border:none;width:42px;height:42px;border-radius:50%;font-size:20px;font-weight:bold;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center}
.controls-hint{position:absolute;bottom:20px;right:20px;background:rgba(15,23,42,0.8);border:1px solid #334155;color:white;padding:12px 16px;border-radius:12px;text-align:right;pointer-events:auto;font-size:14px}
#quiz-modal{position:absolute;inset:0;background:rgba(15,23,42,0.9);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:16px;pointer-events:auto;z-index:100;overflow-y:auto;user-select:none;-webkit-user-select:none}
#quiz-modal-content{width:100%;max-width:640px;margin:auto}
#flee-btn{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:105;box-shadow:0 6px 20px #0008}

/* Anti-Cheat Overlay */
#cheat-overlay{
  position:fixed;inset:0;background:rgba(127,29,29,0.96);backdrop-filter:blur(10px);
  z-index:9999;display:none;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:24px;color:#fff;user-select:none;
}
</style>
</head>
<body>

<!-- UI Asli untuk Guru, Layar, dan Join -->
<main id="app"></main>

<!-- Layar Peringatan Anti-Cheating -->
<div id="cheat-overlay">
  <div style="font-size:64px;margin-bottom:12px">🚨</div>
  <h1 style="color:#FEF08A;font-size:32px;font-weight:900;margin-bottom:8px">PERINGATAN ANTI-CHEATING!</h1>
  <p id="cheat-msg" style="font-size:18px;max-width:480px;line-height:1.5;margin-bottom:16px">
    Kamu terdeteksi keluar dari tab kuis atau membuka aplikasi lain!
  </p>
  <div id="cheat-timer" style="font-size:28px;font-weight:800;color:#FCA5A5;margin-bottom:20px"></div>
  <button id="cheat-resume" style="background:#FEF08A;color:#7F1D1D;padding:14px 28px;font-size:18px;border-radius:99px;display:none">
    Saya Mengerti & Lanjutkan
  </button>
</div>

<!-- UI Lapisan 3D (Hanya untuk Siswa setelah Join) -->
<div id="game-ui">
    <div id="hud">
        <div class="pill" id="hud-sc">⭐ 0 poin</div>
        <div class="pill" id="hud-on">👥 1</div>
        <div class="pill" id="hud-ac" style="border-color:#10B98188;color:#6EE7B7">🛡️ Aman</div>
        <button class="s" id="hud-lb" style="border-radius:99px;padding:8px 16px">🏆 Klasemen</button>
    </div>

    <div class="controls-hint" id="controls-hint" style="display:none">
        <b>WASD</b> / <b>Panah</b> : Bergerak<br>
        <b>Mouse / Geser</b> : Putar Kamera<br>
        Cari Papan Pengumuman Soal!
    </div>
    
    <div id="start-screen">
        <div class="text-center mt-8">
            <h1 class="text-4xl md:text-5xl font-extrabold text-yellow-400 mb-2 drop-shadow-lg">Diskon Detektif 3D</h1>
            <p class="text-lg md:text-xl text-gray-200">Pilih Karakter & Mulai Eksplorasi Desa!</p>
        </div>
        <div class="char-selector shadow-xl">
            <button class="char-btn" onclick="changeSkin(-1)"><</button>
            <div id="skin-name" class="text-2xl font-bold w-40 text-center">Warga</div>
            <button class="char-btn" onclick="changeSkin(1)">></button>
        </div>
        <button class="bg-yellow-500 hover:bg-yellow-400 text-black px-12 py-4 rounded-full font-bold text-2xl shadow-lg transform transition hover:scale-105 mb-8" onclick="startGame()">Mulai Main</button>
    </div>

    <div id="joy" style="display:none;position:absolute;left:24px;bottom:28px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.4);pointer-events:auto;touch-action:none">
        <div id="joyk" style="position:absolute;left:40px;top:40px;width:40px;height:40px;border-radius:50%;background:rgba(245,158,11,.9)"></div>
    </div>

    <div id="quiz-modal">
        <div id="quiz-modal-content"></div>
        <button id="flee-btn" class="s" style="padding:12px 24px;border-radius:30px;font-size:16px" onclick="fleeQuiz()">🏃 Kabur Dulu! (Tutup)</button>
    </div>
</div>

<script>
// Helper global dideklarasikan paling atas agar bisa dipakai semua modul
const $=id=>document.getElementById(id),L='ABCD';

// ==========================================
// 0. SISTEM ANTI-CHEATING & ANTI-BUKA TAB
// ==========================================
let antiCheatActive = false;
let cheatCount = 0;
let cheatGraceTimer = null;
let activeQuizAutoFail = null;

function playBeep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(520, ctx.currentTime);
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + 0.35);
  } catch(e) {}
}

function updateCheatHud() {
  const el = $('hud-ac');
  if (!el) return;
  if (cheatCount === 0) {
    el.textContent = '🛡️ Aman';
    el.style.borderColor = '#10B98188';
    el.style.color = '#6EE7B7';
  } else {
    el.textContent = `⚠️ Pelanggaran: ${cheatCount}x`;
    el.style.borderColor = '#F43F5E';
    el.style.color = '#FDA4AF';
  }
}

function triggerCheatWarning(reason) {
  if (!antiCheatActive) return;
  if (location.hash === '#guru' || location.hash === '#layar') return;
  if (cheatGraceTimer) return;

  playBeep();
  const ov = $('cheat-overlay');
  const tm = $('cheat-timer');
  const btn = $('cheat-resume');
  const msg = $('cheat-msg');

  ov.style.display = 'flex';
  btn.style.display = 'none';
  msg.textContent = reason || 'Kamu terdeteksi keluar dari tab kuis atau membuka aplikasi lain!';

  let sec = 3;
  tm.textContent = `Kembali dalam ${sec} detik sebelum soal dianggap HANGUS...`;

  cheatGraceTimer = setInterval(() => {
    sec--;
    if (sec > 0) {
      tm.textContent = `Kembali dalam ${sec} detik sebelum soal dianggap HANGUS...`;
    } else {
      clearInterval(cheatGraceTimer);
      cheatGraceTimer = null;
      cheatCount++;
      updateCheatHud();
      tm.textContent = `Pelanggaran tercatat (${cheatCount}x)! Soal aktif otomatis ditutup/hangus.`;
      btn.style.display = 'inline-block';

      if (typeof activeQuizAutoFail === 'function') {
        const fn = activeQuizAutoFail;
        activeQuizAutoFail = null;
        fn();
      }
    }
  }, 1000);
}

function cancelGraceIfReturned() {
  if (cheatGraceTimer && !document.hidden) {
    clearInterval(cheatGraceTimer);
    cheatGraceTimer = null;
    $('cheat-overlay').style.display = 'none';
  }
}

$('cheat-resume').onclick = () => {
  $('cheat-overlay').style.display = 'none';
};

document.addEventListener('visibilitychange', () => {
  if (document.hidden) triggerCheatWarning('Tab game disembunyikan atau pindah ke aplikasi lain!');
  else cancelGraceIfReturned();
});

window.addEventListener('blur', () => {
  triggerCheatWarning('Fokus layar berpindah (Split Screen / Pop-up / Tab lain terdeteksi)!');
});

window.addEventListener('focus', cancelGraceIfReturned);

document.addEventListener('contextmenu', e => {
  if (antiCheatActive && location.hash !== '#guru' && location.hash !== '#layar') e.preventDefault();
});
['copy', 'cut', 'paste'].forEach(ev => {
  document.addEventListener(ev, e => {
    if (antiCheatActive && location.hash !== '#guru' && location.hash !== '#layar') e.preventDefault();
  });
});
document.addEventListener('keydown', e => {
  if (!antiCheatActive || location.hash === '#guru' || location.hash === '#layar') return;
  if (
    e.key === 'F12' ||
    (e.ctrlKey && e.shiftKey && ['I','J','C'].includes(e.key.toUpperCase())) ||
    (e.ctrlKey && ['U','C','V','X','S','P'].includes(e.key.toUpperCase()))
  ) {
    e.preventDefault();
  }
});

// ==========================================
// 1. SISTEM BACKEND GOOGLE SCRIPT & UTILS
// ==========================================
const API='https://script.google.com/macros/s/AKfycbxdp8xZAHlhheCWztk_KYXrXqH0LdNsNKMMcHRUjpSX0qzq6hXI_842p3OjJqfQfR_2rw/exec';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&','<':'<','>':'>','"':'"'}[c]));
async function api(a,d={}){const r=await fetch(API,{method:'POST',body:JSON.stringify({a,...d})});const j=await r.json();if(!j.ok)throw new Error(j.err);return j}
let S=JSON.parse(localStorage.getItem('kuis')||'{}'),T=null,T2=null,P=null,off=0,key='',E=0,PE=0;
let target=$('app');

const save=()=>localStorage.setItem('kuis',JSON.stringify(S)),err=e=>alert(e.message||e),stop=()=>{clearInterval(T);clearInterval(T2);clearTimeout(P)};
const imgu=u=>{const m=u.match(/\/d\/([\w-]+)/)||u.match(/[?&]id=([\w-]+)/);return/drive\.google\.com/.test(u)&&m?'https://drive.google.com/thumbnail?id='+m[1]+'&sz=w1000':u};
const gimg=(g,h=240)=>g?`<img src="${esc(imgu(g))}" alt="" style="max-width:100%;max-height:${h}px;border-radius:12px;margin-top:10px" onerror="this.remove()">`:'';

function timer(t0,dur,end){E=t0+dur*1000;const f=()=>{const l=(E-(Date.now()+off))/1000;const tm=$('tm'),tb=$('tb');if(tm)tm.textContent=Math.max(0,Math.ceil(l));if(tb)tb.style.width=Math.min(100,Math.max(0,l/dur*100))+'%';if(l<=0){clearInterval(T);end()}};f();T=setInterval(f,250)}

function qView(q,dur,t0,total,pick){
  target.innerHTML=`<div class=row><span class=m>Soal ${q.no} dari ${total}</span><span class=big id=tm style="margin-left:auto"></span></div><div class=bar><i id=tb></i></div><div class=card><div class=big>${esc(q.q)}</div>${gimg(q.g)}</div><div class=opts>${q.o.map((o,x)=>o?`<button class="o o${x}" data-l="${L[x]}"><b>${L[x]}</b>${esc(o)}</button>`:'').join('')}</div><p id=msg class=m></p>`;
  let done=false;
  const send=async l=>{
    if(done)return;done=true;
    activeQuizAutoFail = null;
    document.querySelectorAll('.o').forEach(b=>{b.disabled=true;if(b.dataset.l==l)b.classList.add('me')});
    try{await pick(l)}catch(e){if(!/Sudah|habis/.test(e.message))err(e)}
  };
  activeQuizAutoFail = () => send('-');

  document.querySelectorAll('.o').forEach(b=>b.onclick=()=>send(b.dataset.l));
  timer(t0,dur,()=>send('-'));
}

function resView(r,mine,next){
  const s=r.st,n=s.n||1,ok=mine==r.k;
  target.innerHTML=`<div class=card><div class=big style="color:${ok?'var(--g)':'var(--r)'}">${mine=='-'?'Waktu habis / Hangus':ok?'Benar!':'Belum tepat'}${r.poin!=null?' · +'+r.poin+' poin':''}</div><p>Jawaban benar: <b>${r.k}</b></p><p class=m>${esc(r.x||'')}</p></div><div class=card><b>Hasil kelas: ${s.benar} benar · ${s.salah} salah</b>${[...L].map(l=>`<div class=m>${l}${l==r.k?' (benar)':''} · ${s[l]||0} siswa</div><div class=bar><i style="width:${(s[l]||0)/n*100}%"></i></div>`).join('')}</div>${next?'<button id=nx style="width:100%">Lanjut</button>':''}`;
  if(next)$('nx').onclick=next;
}

async function board(end){
  stop();
  activeQuizAutoFail = null;
  if(end) antiCheatActive = false;
  try{
    const j=await api('lb',{pid:S.pid});
    target.innerHTML=`<h1>${end?'Klasemen Akhir':'Klasemen'}</h1><div class=card><table>${j.lb.map((r,i)=>`<tr${r.pid==S.pid?' style="color:var(--a)"':''}><td>${['🥇','🥈','🥉'][i]||i+1}</td><td>${esc(r.nama)}<div class=m>${esc(r.kelas)}</div></td><td>${r.benar} benar, ${r.salah} salah</td><td><b>${r.poin}</b></td></tr>`).join('')}</table></div>${j.me?`<div class=card>Peringkatmu: <b>#${j.me.rank}</b> dari ${j.n} siswa · ${j.me.poin} poin</div>`:''}`;
  }catch(e){err(e)}
}

// ==========================================
// 2. LOGIKA KUIS SISWA (PAPAN PENGUMUMAN)
// ==========================================
function closeQ(){
  activeQuizAutoFail = null;
  $('quiz-modal').style.display='none';
  if(activeBox){activeBox.active=false;scene.remove(activeBox.mesh);activeBox=null}
  gameActive=true;
}

function openUI(){
  gameActive=false;
  for(const k in keys)keys[k]=false;
  joy.x=joy.y=0;
  $('quiz-modal').style.display='flex';
  target=$('quiz-modal-content');
}

async function mandiri(){
  stop();
  if(S.i>=S.total) { hide3D(); target = $('app'); return board(true); }
  openUI();
  target.innerHTML = `<div class="card"><div class="big">Mengambil soal...</div></div>`;
  try{
    const j=await api('q',{pid:S.pid,i:S.i});
    off=j.now-Date.now();
    $('flee-btn').style.display='block';
    qView(j.q,j.dur,j.t0,S.total,async l=>{
      $('flee-btn').style.display = 'none';
      let r;
      try{r=await api('ans',{pid:S.pid,i:S.i,j:l})}
      catch(e){
        if(/Sudah/.test(e.message)){S.i++;save();return mandiri()}
        if(/habis/.test(e.message)){S.i++;save();closeQ();return;}
        throw e;
      }
      resView(r,l,()=>{
        S.i++;save();
        closeQ();
      });
    });
  }catch(e){err(e); window.fleeQuiz();}
}

function showLb(){
  activeBox=null;
  openUI();
  $('flee-btn').style.display='block';
  board(false);
}

async function live(){
  clearTimeout(P);
  try{
    const j=await api('state',{pid:S.pid});
    off=j.now-Date.now();
    if(j.phase=='question'&&j.dur) E=j.openAt+j.dur*1000;
    const k=j.phase+j.qi;
    if(k!=key){ key=k; lview(j); }
  }catch(e){
    if(/gabung lagi|tidak dikenal/.test(e.message)){ localStorage.removeItem('kuis'); S={}; return home(); }
  }
  P=setTimeout(live,3000);
}

function lview(j){
  clearInterval(T);
  target = $('quiz-modal-content');
  if(j.phase=='question') {
    $('quiz-modal').style.display = 'flex';
    $('flee-btn').style.display = 'none';
    gameActive = false;
    qView(j.q,j.dur,j.openAt,j.total,async l=>{
      await api('ans',{pid:S.pid,j:l});
      $('msg').textContent=l=='-'?'Waktu habis / Hangus':'Jawaban terkirim, menunggu hasil...';
    });
  }
  else if(j.phase=='result') {
    activeQuizAutoFail = null;
    $('quiz-modal').style.display = 'flex';
    $('flee-btn').style.display = 'none';
    gameActive = false;
    resView(j.res,j.res.j,null);
  }
  else if(j.phase=='board'||j.phase=='end') {
    hide3D(); target = $('app'); board(j.phase=='end');
  }
  else {
    activeQuizAutoFail = null;
    $('quiz-modal').style.display = 'none';
    gameActive = true;
  }
}

function joinView(k){
  antiCheatActive = false;
  target=$('app');
  target.innerHTML=`<h1>Kuis Diskon Detektif 3D</h1><div class=card><p class=m style="margin-top:0">⚠️ Mode Anti-Cheating aktif selama permainan. Jangan berpindah tab atau membuka aplikasi lain saat bermain.</p><input id=n placeholder="Nama lengkap" autocomplete=off><input id=k2 placeholder="Kelas, contoh X-1"><input id=c placeholder="Kode sesi" inputmode=numeric value="${esc(k)}"><button id=go style="width:100%">Gabung ke Desa 3D</button></div>`;
  $('go').onclick=async()=>{
    try{
      const j=await api('join',{nama:$('n').value,kelas:$('k2').value,kode:$('c').value});
      S={pid:j.pid,mode:j.mode,total:j.total,nama:j.nama,i:0};
      save();key='';
      setup3D();
    }catch(e){err(e)}
  }
}

async function home(){
  const k=new URLSearchParams(location.search).get('kode')||'';
  if(S.pid){
    try{
      await api('lb',{pid:S.pid});
      return setup3D();
    }catch(e){localStorage.removeItem('kuis');S={}}
  }
  joinView(k);
}

// ==========================================
// 3. ENGINE 3D THREE.JS (OPTIMIZED UNTUK 30+ SISWA)
// ==========================================
let scene, camera, renderer, rendererCanvas;
let player;
let bots = [], questionBoxes = [], veh = [], an = [], beac = [];
const rem = {};
let gameActive = false, inMenu = true, activeBox = null, syncOn = false;

function initJoystick(){
  const el=$('joy'),k=$('joyk'),R=40;let id=null;
  const mv=e=>{const r=el.getBoundingClientRect();
    let dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);
    const d=Math.hypot(dx,dy);if(d>R){dx*=R/d;dy*=R/d}
    joy.x=dx/R;joy.y=dy/R;k.style.transform=`translate(${dx}px,${dy}px)`};
  const end=()=>{id=null;joy.x=joy.y=0;k.style.transform='translate(0,0)'};
  el.addEventListener('pointerdown',e=>{id=e.pointerId;el.setPointerCapture(id);mv(e)});
  el.addEventListener('pointermove',e=>{if(e.pointerId===id)mv(e)});
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
}

function setup3D() {
  $('app').style.display = 'none';
  $('game-ui').style.display = 'block';
  target = $('quiz-modal-content');
  
  if(!scene) init3D();
  if(rendererCanvas) rendererCanvas.style.display = 'block';

  $('quiz-modal').style.display = 'none';

function init3D() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x87CEEB);
  scene.fog = new THREE.Fog(0x87CEEB, 40, 160);

  camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 350);
  
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.BasicShadowMap;
  
  rendererCanvas = renderer.domElement;
  rendererCanvas.style.position = 'fixed';
  rendererCanvas.style.top = '0';
  rendererCanvas.style.left = '0';
  rendererCanvas.style.zIndex = '1';
  rendererCanvas.style.touchAction = 'none';
  document.body.appendChild(rendererCanvas);

  const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
  scene.add(ambientLight);
  
  const dirLight = new THREE.DirectionalLight(0xffffff, 0.75);
  dirLight.position.set(50, 100, 50);
  dirLight.castShadow = true;
  dirLight.shadow.mapSize.set(1024, 1024);
  dirLight.shadow.camera.top = 110; dirLight.shadow.camera.bottom = -110;
  dirLight.shadow.camera.left = -110; dirLight.shadow.camera.right = 110;
  scene.add(dirLight);

  buildVillage();
  buildTopicBuildings();
  spawnVehicles();
  spawnAnimals();
  spawnTrees();
  updatePlayerSkin();

  for(let i = 0; i < 8; i++) {
    const bot = createCharacter(skins[Math.floor(Math.random() * skins.length)]);
    bot.group.position.set((Math.random()-0.5)*120, 0, (Math.random()-0.5)*120);
    scene.add(bot.group);
    bots.push({ char: bot, target: new THREE.Vector3((Math.random()-0.5)*120, 0, (Math.random()-0.5)*120), speed: 0.05 + Math.random() * 0.07, wait: 0 });
  }

  for(let i = 0; i < 20; i++) {
    let bx, bz;
    do { bx = (Math.random() - 0.5) * 120; bz = (Math.random() - 0.5) * 120; } while(Math.abs(bx) < 16 && Math.abs(bz) < 16);
    createBulletinBoard(bx, bz);
  }

  $('hud-lb').onclick = showLb;

  window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
  document.addEventListener('keydown', (e) => { if(keys.hasOwnProperty(e.key)) keys[e.key] = true; });
  document.addEventListener('keyup', (e) => { if(keys.hasOwnProperty(e.key)) keys[e.key] = false; });
  
  const moveCam = (dx, dy) => { cameraAngle.theta -= dx * 0.01; cameraAngle.phi -= dy * 0.01; cameraAngle.phi = Math.max(0.1, Math.min(Math.PI/2 - 0.1, cameraAngle.phi)); };
  rendererCanvas.addEventListener('mousedown', () => isMouseDown = true);
  rendererCanvas.addEventListener('mouseup', () => isMouseDown = false);
  rendererCanvas.addEventListener('mousemove', (e) => { if (isMouseDown && gameActive) moveCam(e.movementX, e.movementY); });
  
  rendererCanvas.addEventListener('touchstart', (e) => { isMouseDown = true; const t=e.changedTouches[0]; previousMousePosition = { x: t.clientX, y: t.clientY }; }, {passive: false});
  rendererCanvas.addEventListener('touchend', () => isMouseDown = false);
  rendererCanvas.addEventListener('touchmove', (e) => {
    if(isMouseDown && gameActive) { const t=e.changedTouches[0]; moveCam(t.clientX - previousMousePosition.x, t.clientY - previousMousePosition.y); previousMousePosition = { x: t.clientX, y: t.clientY }; }
  }, {passive: false});

  initJoystick();
  animate();
}

function buildVillage() {
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(320, 320), mat(0x7CB342));
  ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

  const plaza = new THREE.Mesh(new THREE.PlaneGeometry(24, 24), mat(0x9E9E9E));
  plaza.rotation.x = -Math.PI / 2; plaza.position.y = 0.01; plaza.receiveShadow = true; scene.add(plaza);

  const roadMat = mat(0x475569);
  const roadH = new THREE.Mesh(new THREE.PlaneGeometry(320, 12), roadMat); roadH.rotation.x = -Math.PI/2; roadH.position.y = 0.02; roadH.receiveShadow = true;
  const roadV = new THREE.Mesh(new THREE.PlaneGeometry(12, 320), roadMat); roadV.rotation.x = -Math.PI/2; roadV.position.y = 0.02; roadV.receiveShadow = true;
  scene.add(roadH); scene.add(roadV);

  createMosque(-70, -70, 0);

  for(let i = -110; i <= 110; i += 35) {
    for(let j = -110; j <= 110; j += 35) {
      if(Math.abs(i) < 48 && Math.abs(j) < 48) continue;
      if(i <= -55 && j <= -55) continue;
      let x = i + rnd(-4, 4), z = j + rnd(-4, 4);
      let rot = Math.abs(x) < Math.abs(z) ? (x > 0 ? -Math.PI/2 : Math.PI/2) : (z > 0 ? Math.PI : 0);
      let type = Math.random();
      if (type < 0.6) createHouse(x, z, rot);
      else if (type < 0.8) createFarm(x, z);
      else createAnimalPen(x, z);
    }
  }
}

function makeSign(t){

  const g=c.getContext('2d'),lg=t.length>12;
  g.fillStyle='#0F172A';g.fillRect(0,0,512,128);
  g.strokeStyle='#F59E0B';g.lineWidth=8;g.strokeRect(4,4,504,120);
  g.fillStyle='#FDE68A';g.font='bold '+(lg?30:52)+'px sans-serif';g.textAlign='center';
  g.fillText(t,256,lg?76:84);
  return new THREE.Mesh(new THREE.PlaneGeometry(11,2.75),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(c)}));
}

function spawnVehicles(){

  for(let i=0;i<14;i++){
    const f=pick([makeCar,makeCar,makeMotor,makeMotor,makeBecak]),g=f(),l=pick(lanes),al=rnd(-150,150);
    const sp=f===makeBecak?rnd(.12,.18):f===makeMotor?rnd(.45,.65):rnd(.3,.45);

    scene.add(g);veh.push({g,dx:l[2],dz:l[3],sp});

  const group = new THREE.Group();
  const wCol = pick([0xFFE082, 0xBCAAA4, 0x81D4FA, 0xA5D6A7, 0xF48FB1, 0xFFFFFF]);
  const rCol = pick([0xD84315, 0x5D4037, 0x37474F, 0xC62828]);
  box(8, 5, 8, wCol, 0, 2.5, 0, group, true);
  const roof = new THREE.Mesh(new THREE.ConeGeometry(7, 4, 4), mat(rCol)); roof.position.y = 7; roof.rotation.y = Math.PI / 4; group.add(roof);
  group.position.set(x, 0, z); group.rotation.y = rot; scene.add(group);
}
function createMosque(x, z, rot) {
  const group = new THREE.Group();
  box(16, 7, 16, 0xFFFFFF, 0, 3.5, 0, group, true);
  const domeMat = mat(0x1B5E20);
  const dome = new THREE.Mesh(new THREE.SphereGeometry(5, 12, 12, 0, Math.PI * 2, 0, Math.PI / 2), domeMat); dome.position.y = 7; group.add(dome);
  const tower = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 1.2, 18, 10), mat(0xFFFFFF)); tower.position.set(-7, 9, 7); group.add(tower);
  const towerDome = new THREE.Mesh(new THREE.SphereGeometry(1.2, 8, 8, 0, Math.PI * 2, 0, Math.PI / 2), domeMat); towerDome.position.set(-7, 18, 7); group.add(towerDome);
  group.position.set(x, 0, z); group.rotation.y = rot; scene.add(group);
}

  for(let r=0; r<4; r++) for(let c=0; c<4; c++) box(0.5, 1, 0.5, 0x4CAF50, -4 + r*2.6, 0.5, -4 + c*2.6, farm);

function createAnimalPen(x, z) {
  const pen = new THREE.Group();
  for(let i=0; i<4; i++) {
    const side = new THREE.Group();
    box(0.3, 2, 0.3, 0x795548, -4.8, 1, 0, side);
    box(0.3, 2, 0.3, 0x795548, 4.8, 1, 0, side);
    box(10, 0.3, 0.1, 0x795548, 0, 1.5, 0, side);
    box(10, 0.3, 0.1, 0x795548, 0, 0.7, 0, side);
    side.position.z = 5;
    if(i===1) { side.rotation.y = Math.PI/2; side.position.set(5, 0, 0); }
    if(i===2) { side.rotation.y = Math.PI; side.position.set(0, 0, -5); }
    if(i===3) { side.rotation.y = -Math.PI/2; side.position.set(-5, 0, 0); }

  box(2, 1.5, 3, 0xffffff, 0, 1.5, 0, cow);

  box(1.2, 1.2, 1.2, skin.head, 0, 3.6, 0, bodyWrapper, true);
  box(2, 2, 1, skin.torso, 0, 2, 0, bodyWrapper, true);
  const leftArm = box(0.8, 2, 0.8, skin.head, -1.6, 2, 0, bodyWrapper);
  const rightArm = box(0.8, 2, 0.8, skin.head, 1.6, 2, 0, bodyWrapper);
  const leftLeg = box(0.9, 2, 0.9, skin.leg, -0.5, 0, 0, bodyWrapper);
  const rightLeg = box(0.9, 2, 0.9, skin.leg, 0.5, 0, 0, bodyWrapper);

    const hat = new THREE.Mesh(new THREE.ConeGeometry(1.5, 0.6, 12), mat(0xFBC02D)); hat.position.y = 4.4; bodyWrapper.add(hat);

function applyRem(list){

  (list||[]).forEach(r=>{
    seen[r[0]]=1;
    let o=rem[r[0]];
    if(!o){
      const c=createCharacter(skins[r[5]%skins.length]||skins[0]);
      c.group.add(nameTag(r[1]));
      c.group.position.set(r[2],0,r[3]);
      scene.add(c.group);
      o=rem[r[0]]={c,t:new THREE.Vector3(),ry:0,ph:0};
    }
    o.t.set(r[2],0,r[3]);o.ry=r[4];
  });
  for(const id in rem)if(!seen[id]){scene.remove(rem[id].c.group);delete rem[id]}
}

function updateCamera() {
  if(!player) return;
  const tgt = player.group.position.clone();
  if (inMenu) {
    tgt.y += 2.5; camera.position.lerp(new THREE.Vector3(tgt.x, tgt.y, tgt.z + 8), 0.1); camera.lookAt(tgt);
  } else {
    tgt.y += 2;
    const cx = tgt.x + cameraRadius * Math.sin(cameraAngle.phi) * Math.sin(cameraAngle.theta);
    const cy = tgt.y + cameraRadius * Math.cos(cameraAngle.phi);
    const cz = tgt.z + cameraRadius * Math.sin(cameraAngle.phi) * Math.cos(cameraAngle.theta);
    camera.position.lerp(new THREE.Vector3(cx, cy, cz), 0.2); camera.lookAt(tgt);
  }
}

function updatePlayer() {
  if (!gameActive || !player) return;
  const moveSpeed = 0.32; let isMoving = false;
  const frontVec = new THREE.Vector3(-Math.sin(cameraAngle.theta), 0, -Math.cos(cameraAngle.theta)).normalize();
  const rightVec = new THREE.Vector3(Math.cos(cameraAngle.theta), 0, -Math.sin(cameraAngle.theta)).normalize();
  const moveDir = new THREE.Vector3(0,0,0);
  if (keys.w || keys.ArrowUp) { moveDir.add(frontVec); isMoving = true; }
  if (keys.s || keys.ArrowDown) { moveDir.sub(frontVec); isMoving = true; }
  if (keys.a || keys.ArrowLeft) { moveDir.sub(rightVec); isMoving = true; }
  if (keys.d || keys.ArrowRight) { moveDir.add(rightVec); isMoving = true; }
  if(Math.abs(joy.x)>0.15||Math.abs(joy.y)>0.15){moveDir.addScaledVector(frontVec,-joy.y);moveDir.addScaledVector(rightVec,joy.x);isMoving=true;}

  if (isMoving) {
    moveDir.normalize(); player.group.position.addScaledVector(moveDir, moveSpeed);
    const targetRotation = Math.atan2(moveDir.x, moveDir.z);
    let rotDiff = targetRotation - player.group.rotation.y;
    while (rotDiff > Math.PI) rotDiff -= Math.PI * 2; while (rotDiff < -Math.PI) rotDiff += Math.PI * 2;
    player.group.rotation.y += rotDiff * 0.2;
    player.animTime += 0.25; const swing = Math.sin(player.animTime) * 0.8;
    player.leftLeg.rotation.x = swing; player.rightLeg.rotation.x = -swing;
    player.leftArm.rotation.x = -swing; player.rightArm.rotation.x = swing;
  } else {
    player.leftLeg.rotation.x *= 0.8; player.rightLeg.rotation.x *= 0.8; player.leftArm.rotation.x *= 0.8; player.rightArm.rotation.x *= 0.8;
  }
  player.group.position.x = Math.max(-145, Math.min(145, player.group.position.x));
  player.group.position.z = Math.max(-145, Math.min(145, player.group.position.z));
}

function updateWorldEntities() {
  const t = performance.now() / 1000;
  const pp = player ? player.group.position : new THREE.Vector3();

  beac.forEach((o,i)=>{o.rotation.y+=.03;o.position.y=14+Math.sin(t*2+i)*.5});

  veh.forEach(v=>{
    const p=v.g.position;
    p.x+=v.dx*v.sp; p.z+=v.dz*v.sp;
    if(Math.abs(p.x)>155) p.x=-Math.sign(p.x)*155;
    if(Math.abs(p.z)>155) p.z=-Math.sign(p.z)*155;
    if(gameActive && !inMenu && p.distanceTo(pp)<2.8){
      const a=pp.clone().sub(p); a.y=0; a.normalize(); pp.addScaledVector(a,.9);
    }
  });

  an.forEach(a=>{
    const p=a.g.position;
    if(a.w>0){a.w--;return}
    const d=a.t.clone().sub(p); d.y=0;
    if(d.length()<1){a.w=rnd(60,200);a.t.set(rnd(-110,110),0,rnd(-110,110));return}
    d.normalize(); p.addScaledVector(d,a.sp);
    a.g.rotation.y=Math.atan2(d.x,d.z);
    p.y=Math.abs(Math.sin(t*6+p.x))*.12;
  });

  for(const id in rem){
    const o=rem[id],g=o.c.group,d=g.position.distanceTo(o.t);
    if(d>40)g.position.copy(o.t); else g.position.lerp(o.t,.06);
    let df=o.ry-g.rotation.y;
    while(df>Math.PI)df-=2*Math.PI; while(df<-Math.PI)df+=2*Math.PI;
    g.rotation.y+=df*.15;
    if(d>.25){o.ph+=.25;const s=Math.sin(o.ph)*.8;o.c.leftLeg.rotation.x=s;o.c.rightLeg.rotation.x=-s;o.c.leftArm.rotation.x=-s;o.c.rightArm.rotation.x=s}
    else{o.c.leftLeg.rotation.x*=.8;o.c.rightLeg.rotation.x*=.8;o.c.leftArm.rotation.x*=.8;o.c.rightArm.rotation.x*=.8}
  }

  if (inMenu) return;
  bots.forEach(bot => {
    if (bot.wait > 0) {
      bot.wait--; bot.char.leftLeg.rotation.x *= 0.8; bot.char.rightLeg.rotation.x *= 0.8; bot.char.leftArm.rotation.x *= 0.8; bot.char.rightArm.rotation.x *= 0.8; return;
    }
    const dist = bot.char.group.position.distanceTo(bot.target);
    if (dist < 1.0) { bot.wait = 50 + Math.random() * 100; bot.target.set((Math.random()-0.5)*120, 0, (Math.random()-0.5)*120); }
    else {
      const dir = new THREE.Vector3().subVectors(bot.target, bot.char.group.position).normalize();
      bot.char.group.position.addScaledVector(dir, bot.speed);
      const targetRotation = Math.atan2(dir.x, dir.z);
      let rotDiff = targetRotation - bot.char.group.rotation.y;
      while (rotDiff > Math.PI) rotDiff -= Math.PI * 2; while (rotDiff < -Math.PI) rotDiff += Math.PI * 2;
      bot.char.group.rotation.y += rotDiff * 0.1;
      bot.char.animTime += 0.2; const swing = Math.sin(bot.char.animTime) * 0.6;
      bot.char.leftLeg.rotation.x = swing; bot.char.rightLeg.rotation.x = -swing; bot.char.leftArm.rotation.x = -swing; bot.char.rightArm.rotation.x = swing;
    }
  });
}

function triggerQuiz(qb) {
  joy.x=joy.y=0;
  if (S.mode == 'live') {
    const frontVec = new THREE.Vector3(-Math.sin(player.group.rotation.y), 0, -Math.cos(player.group.rotation.y));
    player.group.position.addScaledVector(frontVec, -6);
    return;
  }
  activeBox = qb;
  $('flee-btn').style.display = 'block';
  mandiri();
}

function checkCollisions() {
  if (!gameActive || !player) return;
  const playerPos = player.group.position;

  questionBoxes.forEach(qb => {
    if (qb.active) {
      qb.time += 0.05; qb.indicator.position.y = 4.8 + Math.sin(qb.time) * 0.3; qb.indicator.rotation.y += 0.05;
      if (playerPos.distanceTo(qb.mesh.position) < 3.5) triggerQuiz(qb);
    }
  });
}

function animate() {
  requestAnimationFrame(animate);
  updatePlayer();
  updateWorldEntities();
  checkCollisions();
  updateCamera();
  renderer.render(scene, camera);
}

window.changeSkin = function(dir) {
  currentSkinIndex += dir; if (currentSkinIndex < 0) currentSkinIndex = skins.length - 1; if (currentSkinIndex >= skins.length) currentSkinIndex = 0;
  document.getElementById('skin-name').innerText = skins[currentSkinIndex].name; updatePlayerSkin();
};

function updatePlayerSkin() {
  const oldPos = player ? player.group.position.clone() : new THREE.Vector3(0,0,0);
  if (player) scene.remove(player.group);
  player = createCharacter(skins[currentSkinIndex]);
  player.group.position.copy(oldPos);
  scene.add(player.group);
}

window.startGame = function() {
  $('start-screen').style.display = 'none';
  $('controls-hint').style.display = 'block';
  $('hud').style.display = 'flex';
  if(S.mode === 'live') $('hud-lb').style.display = 'none';
  inMenu = false; gameActive = true; cameraAngle.theta = 0; cameraAngle.phi = Math.PI / 3;

  antiCheatActive = true;
  updateCheatHud();

  if (S.mode == 'live') live();
  if (!syncOn) { syncOn = true; syncPos(); }
  if(isTouch){ $('joy').style.display='block'; $('controls-hint').style.display='none'; }
};

window.fleeQuiz = function() {
  activeQuizAutoFail = null;
  joy.x=joy.y=0;
  $('quiz-modal').style.display = 'none';
  if(player) {
    const frontVec = new THREE.Vector3(-Math.sin(player.group.rotation.y), 0, -Math.cos(player.group.rotation.y));
    player.group.position.addScaledVector(frontVec, -7);
  }
  gameActive = true;
  clearInterval(T);
};

      $('ctl').innerHTML=s.sesi&&s.mode=='live'?`<button id=nx>${last?'🏁 Selesai: Klasemen Akhir':'▶️ Buka Soal '+(s.qi+2)}</button><button class=s id=ex>⏱️ +10 Detik</button><button class=s id=cl>⏹️ Tutup Soal</button><button class=s id=bd>🏆 Klasemen</button>`:(s.sesi?'<span class=m>Mode mandiri aktif: siswa mencari papan soal di desa.</span>':'<span class=m>Mulai sesi baru terlebih dahulu.</span>');
      if($('nx')){$('nx').onclick=()=>last?go('a_phase',{phase:'end'}):go('a_open',{i:s.qi+1});$('ex').onclick=()=>go('a_extend');$('cl').onclick=()=>go('a_phase',{phase:'result'});$('bd').onclick=()=>go('a_phase',{phase:'board'})}}
    let h='';if(s.sesi&&s.mode=='live'){if(c&&(s.phase=='question'||s.phase=='result'))h+=`<div class=card style="margin:0 0 8px;background:#0b1120"><div class=row><span class=m>Tampil di layar siswa · soal ${c.no} · ${c.t=='bs'?'Benar/Salah':'Pilihan ganda'}</span>${s.phase=='question'?'<b id=pt style="margin-left:auto;color:var(--a)"></b>':''}</div><div class=big>${esc(c.q)}</div>${gimg(c.g,160)}${bars(c,c.st)}<p class=m>${j.jawab} dari ${j.peserta} siswa sudah menjawab${s.phase=='result'?' · '+esc(c.x):''}</p></div>`;
      if(j.nxt)h+=`<div class=card style="margin:0;background:#0b1120;border-left-color:#334155"><div class=m>Berikutnya: soal ${j.nxt.no} · kunci <b>${j.nxt.t=='bs'?(j.nxt.k=='A'?'Benar':'Salah'):j.nxt.k}</b></div>${esc(j.nxt.q)}</div>`}
    $('pv').innerHTML=h;
    $('lbx').innerHTML=j.lb.length?'<table><tr><th>#</th><th>Siswa</th><th>Skor</th><th>Poin</th></tr>'+j.lb.map((r,i)=>`<tr><td>${['🥇','🥈','🥉'][i]||i+1}</td><td><b>${esc(r.nama)}</b> <span class=m>${esc(r.kelas)}</span></td><td>${r.benar}✓ ${r.salah}✗</td><td><b style="color:var(--a)">${r.poin}</b></td></tr>`).join('')+'</table>':'<p class=m>Belum ada siswa yang mengumpulkan poin.</p>'}catch(e){}};
  loadQ();poll();T=setInterval(poll,3500);tick();
}

function lay(A){
  $('app').className='wide';document.body.style.fontSize='22px';
  const poll=async()=>{try{const j=await A('a_info'),s=j.st,c=j.cur;PE=c?c.end-(j.now-Date.now()):0;let h='';
    if(!s.sesi||s.phase=='lobby')h=`<div style="text-align:center;padding-top:20px"><h1 style="font-size:48px">🕵️ Kuis Diskon Detektif 3D</h1>${s.sesi?`<p>Scan QR atau buka <b>${url()}</b></p><div style="margin:20px 0">${qr(280,s.kode)}</div><div class=big style="font-size:68px;color:var(--a);letter-spacing:4px">Kode ${s.kode}</div><p class=big>${j.peserta} siswa sudah masuk ke desa</p>`:'<p>Menunggu guru memulai sesi...</p>'}</div>`;
    else if(s.phase=='board'||s.phase=='end')h=`<h1 style="font-size:46px">${s.phase=='end'?'🏆 Klasemen Akhir':'🏆 Klasemen Sementara'}</h1><div class=card><table style="font-size:28px">${j.lb.map((r,i)=>`<tr><td>${['🥇','🥈','🥉'][i]||i+1}</td><td>${esc(r.nama)} <span class=m>${esc(r.kelas)}</span></td><td>${r.benar} benar</td><td><b style="color:var(--a)">${r.poin}</b></td></tr>`).join('')}</table></div>`;
    else if(c){const res=s.phase=='result',t=c.st;h=`<div class=row><span class=m>Soal ${c.no} dari ${j.total}</span>${res?'':'<span class=big id=pt style="margin-left:auto;font-size:42px;color:var(--a)"></span>'}</div><div class=card><div class=big style="font-size:34px">${esc(c.q)}</div>${gimg(c.g,340)}</div><div class=opts>${c.o.map((o,x)=>o?`<div class="o o${x}" style="font-size:28px;${res&&L[x]!=c.k?'opacity:.35;':''}${res&&L[x]==c.k?'outline:6px solid #fff;':''}"><b>${L[x]}</b><span style="flex:1">${esc(o)}</span>${res?`<span>${t[L[x]]||0}</span>`:''}</div>`:'').join('')}</div>${res?`<p class=big>${t.benar} benar · ${t.salah} salah</p><p class=m>${esc(c.x)}</p>`:`<p class=m>${j.jawab} dari ${j.peserta} sudah menjawab</p>`}`}
    target.innerHTML=h}catch(e){}};
  poll();T=setInterval(poll,2500);tick();
}

function route(){
  stop(); document.body.style.fontSize=''; $('app').className='';
  const h=location.hash;
  if(h=='#guru') { antiCheatActive=false; hide3D(); target=$('app'); gate(dash); }
  else if(h=='#layar') { antiCheatActive=false; hide3D(); target=$('app'); gate(lay); }
  else { hide3D(); home(); }
}

window.onhashchange=route;route();
</script>
</body>
</html>
