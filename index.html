<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Kuis Diskon Detektif 3D</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<!-- KaTeX untuk Render Rumus Matematika LaTeX -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<style>
:root{--bg:#0F172A;--c:#1E293B;--t:#F8FAFC;--m:#94A3B8;--a:#F59E0B;--g:#10B981;--r:#F43F5E}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:16px/1.45 system-ui,sans-serif;overflow-x:hidden}
#app{max-width:640px;margin:0 auto;padding:16px;position:relative;z-index:10}
#app.wide{max-width:1000px}
.card{background:var(--c);border:2px solid #334155;border-radius:16px;padding:18px;margin:12px 0}
h1,h2{margin:.2em 0;color:var(--a)}
input,select,textarea{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:2px solid #334155;background:var(--bg);color:var(--t);font:inherit}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 16px;background:var(--a);color:#0F172A;cursor:pointer}
button.s{background:#334155;color:var(--t)}button.d{background:var(--r);color:#fff}button:disabled{opacity:.5}
.opts{display:grid;gap:10px}.o{display:flex;gap:10px;align-items:center;text-align:left;color:#fff;padding:16px;border-radius:12px}.o b{background:#0006;border-radius:8px;padding:2px 10px}
.o0{background:#2563EB}.o1{background:#D97706}.o2{background:#7C3AED}.o3{background:#059669}.o.me{outline:4px solid #fff}
.bar{height:10px;background:#334155;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--a)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>button{flex:1}.m{color:var(--m);font-size:14px}.big{font-size:22px;font-weight:700}
.two{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:start}@media(max-width:600px){.two{grid-template-columns:1fr}}
.it{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px 0;border-bottom:1px solid #334155}.it button{padding:6px 10px}.it .q{flex:1;min-width:180px}
table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #334155;text-align:left}
.katex{font-size:1.12em}

/* UI 3D Core */
#game-ui{position:fixed;inset:0;pointer-events:none;z-index:5;display:none}
#start-screen{background:rgba(15,23,42,0.85);color:#fff;position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;align-items:center;pointer-events:auto;padding:40px 20px}
.char-selector{display:flex;align-items:center;gap:20px;background:rgba(0,0,0,0.6);border:1px solid #F59E0B66;padding:15px 30px;border-radius:50px;margin-bottom:20vh}
.char-btn{background:#F59E0B;color:#000;border:none;width:42px;height:42px;border-radius:50%;font-size:20px;font-weight:bold;cursor:pointer;padding:0}
.controls-hint{position:absolute;bottom:20px;right:20px;background:rgba(15,23,42,0.8);color:#fff;padding:12px 16px;border-radius:12px;text-align:right;font-size:14px}
#quiz-modal{position:absolute;inset:0;background:rgba(15,23,42,0.9);display:none;align-items:center;justify-content:center;padding:16px;pointer-events:auto;z-index:100;overflow-y:auto}
#quiz-modal-content{width:100%;max-width:640px;margin:auto}
#flee-btn{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:105}
</style>
</head>
<body>
<main id="app"></main>

<div id="game-ui">
  <div class="controls-hint" id="controls-hint" style="display:none">
    <b>WASD</b> / <b>Panah</b> : Bergerak<br>
    <b>Mouse / Geser</b> : Putar Kamera<br>
    Cari Papan Soal / Gerbang Arena!
  </div>
  <div id="start-screen">
    <div class="text-center mt-8">
      <h1 class="text-4xl font-extrabold text-yellow-400 mb-2">Diskon Detektif 3D</h1>
      <p class="text-lg text-gray-200">Pilih Karakter & Mulai Eksplorasi Desa!</p>
    </div>
    <div class="char-selector">
      <button class="char-btn" onclick="changeSkin(-1)"><</button>
      <div id="skin-name" class="text-2xl font-bold w-40 text-center">Warga</div>
      <button class="char-btn" onclick="changeSkin(1)">></button>
    </div>
    <button class="bg-yellow-500 text-black px-12 py-4 rounded-full font-bold text-2xl mb-8" onclick="window.startGame()">Mulai Main</button>
  </div>
  <div id="joy" style="display:none;position:absolute;left:24px;bottom:28px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.4);pointer-events:auto;touch-action:none">
    <div id="joyk" style="position:absolute;left:40px;top:40px;width:40px;height:40px;border-radius:50%;background:rgba(245,158,11,.9)"></div>
  </div>
  <div id="quiz-modal">
    <div id="quiz-modal-content"></div>
    <button id="flee-btn" class="s" style="padding:12px 24px;border-radius:30px" onclick="window.fleeQuiz()">🏃 Kabur Dulu!</button>
  </div>
</div>

<script>
const API='https://script.google.com/macros/s/AKfycbxdp8xZAHlhheCWztk_KYXrXqH0LdNsNKMMcHRUjpSX0qzq6hXI_842p3OjJqfQfR_2rw/exec';
const $=id=>document.getElementById(id),L='ABCD';
let target=$('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&','<':'<','>':'>','"':'"'}[c]));

// Helper Render LaTeX KaTeX secara otomatis
window.renderTex=function(el){
  if(!el||typeof renderMathInElement!=='function')return;
  try{
    renderMathInElement(el,{
      delimiters:[
        {left:'$$',right:'$$',display:true},
        {left:'$',right:'$',display:false},
        {left:'\\(',right:'\\)',display:false},
        {left:'\\[',right:'\\]',display:true}
      ],
      throwOnError:false
    });
  }catch(e){}
};

let api=async function(a,d={}){const r=await fetch(API,{method:'POST',body:JSON.stringify({a,...d})});const j=await r.json();if(!j.ok)throw new Error(j.err);return j};
let S=JSON.parse(localStorage.getItem('kuis')||'{}'),T=null,T2=null,P=null,off=0,key='',E=0,PE=0;
const save=()=>localStorage.setItem('kuis',JSON.stringify(S)),err=e=>alert(e.message||e),stop=()=>{clearInterval(T);clearInterval(T2);clearTimeout(P)};
const imgu=u=>{const m=u.match(/\/d\/([\w-]+)/)||u.match(/[?&]id=([\w-]+)/);return/drive\.google\.com/.test(u)&&m?'https://drive.google.com/thumbnail?id='+m[1]+'&sz=w1000':u};
const gimg=(g,h=240)=>g?`<img src="${esc(imgu(g))}" alt="" style="max-width:100%;max-height:${h}px;border-radius:12px;margin-top:10px" onerror="this.remove()">`:'';

function timer(t0,dur,end){E=t0+dur*1000;const f=()=>{const l=(E-(Date.now()+off))/1000;if($('tm'))$('tm').textContent=Math.max(0,Math.ceil(l));if($('tb'))$('tb').style.width=Math.min(100,Math.max(0,l/dur*100))+'%';if(l<=0){clearInterval(T);end()}};f();T=setInterval(f,250)}
function qView(q,dur,t0,total,pick){target.innerHTML=`<div class=row><span class=m>Soal ${q.no} dari ${total}</span><span class=big id=tm style="margin-left:auto"></span></div><div class=bar><i id=tb></i></div><div class=card><div class=big>${esc(q.q)}</div>${gimg(q.g)}</div><div class=opts>${q.o.map((o,x)=>o?`<button class="o o${x}" data-l="${L[x]}"><b>${L[x]}</b><span>${esc(o)}</span></button>`:'').join('')}</div><p id=msg class=m></p>`;
 renderTex(target);
 let done=false;const send=async l=>{if(done)return;done=true;document.querySelectorAll('.o').forEach(b=>{b.disabled=true;if(b.dataset.l==l)b.classList.add('me')});try{await pick(l)}catch(e){if(!/Sudah|habis/.test(e.message))err(e)}};
 document.querySelectorAll('.o').forEach(b=>b.onclick=()=>send(b.dataset.l));timer(t0,dur,()=>send('-'))}
function resView(r,mine,next){const s=r.st,n=s.n||1,ok=mine==r.k;target.innerHTML=`<div class=card><div class=big style="color:${ok?'var(--g)':'var(--r)'}">${mine=='-'?'Waktu habis':ok?'Benar!':'Belum tepat'}${r.poin!=null?' · +'+r.poin+' poin':''}</div><p>Jawaban benar: <b>${r.k}</b></p><p class=m>${esc(r.x||'')}</p></div><div class=card><b>Hasil kelas: ${s.benar} benar · ${s.salah} salah</b>${[...L].map(l=>`<div class=m>${l}${l==r.k?' (benar)':''} · ${s[l]||0} siswa</div><div class=bar><i style="width:${(s[l]||0)/n*100}%"></i></div>`).join('')}</div>${next?'<button id=nx style="width:100%">Lanjut</button>':''}`;renderTex(target);if(next)$('nx').onclick=next}
async function board(end){stop();try{const j=await api('lb',{pid:S.pid});target.innerHTML=`<h1>${end?'Klasemen Akhir':'Klasemen'}</h1><div class=card><table>${j.lb.map((r,i)=>`<tr${r.pid==S.pid?' style="color:var(--a)"':''}><td>${['🥇','🥈','🥉'][i]||i+1}</td><td>${esc(r.nama)}<div class=m>${esc(r.kelas)}</div></td><td>${r.benar} benar, ${r.salah} salah</td><td><b>${r.poin}</b></td></tr>`).join('')}</table></div>${j.me?`<div class=card>Peringkatmu: <b>#${j.me.rank}</b> dari ${j.n} siswa · ${j.me.poin} poin</div>`:''}`}catch(e){err(e)}}

window.handleKicked=function(msg){
  stop();localStorage.removeItem('kuis');S={};hide3D();
  alert(msg||'Kamu telah dikeluarkan dari sesi oleh guru.');
  joinView('');
};

let mandiri=async function(){stop();if(S.i>=S.total){hide3D();target=$('app');return board(true)}
 gameActive=false;$('quiz-modal').style.display='flex';target=$('quiz-modal-content');$('flee-btn').style.display='block';
 try{const j=await api('q',{pid:S.pid,i:S.i});if(j.ended){hide3D();target=$('app');return board(true)}off=j.now-Date.now();
  qView(j.q,j.dur,j.t0,S.total,async l=>{let r;try{r=await api('ans',{pid:S.pid,i:S.i,j:l})}catch(e){if(/Sudah/.test(e.message)){S.i++;save();return mandiri()}throw e}resView(r,l,()=>{S.i++;save();$('quiz-modal').style.display='none';if(activeBox){activeBox.active=false;scene.remove(activeBox.mesh);activeBox=null}gameActive=true})})}catch(e){if(/dikeluarkan|gabung lagi|tidak dikenal/.test(e.message))return handleKicked(e.message);err(e);window.fleeQuiz()}};

async function live(){clearTimeout(P);try{const j=await api('state',{pid:S.pid});off=j.now-Date.now();if(j.phase=='question'&&j.dur)E=j.openAt+j.dur*1000;const k=j.phase+j.qi;if(k!=key){key=k;lview(j)}}catch(e){if(/dikeluarkan|gabung lagi|tidak dikenal/.test(e.message))return handleKicked(e.message)}P=setTimeout(live,2500)}

let lview=function(j){clearInterval(T);target=$('quiz-modal-content');
 if(j.phase=='question'){$('quiz-modal').style.display='flex';$('flee-btn').style.display='none';gameActive=false;qView(j.q,j.dur,j.openAt,j.total,async l=>{await api('ans',{pid:S.pid,j:l});$('msg').textContent=l=='-'?'Waktu habis':'Jawaban terkirim, menunggu hasil...'})}
 else if(j.phase=='result'){$('quiz-modal').style.display='flex';$('flee-btn').style.display='none';gameActive=false;resView(j.res,j.res.j,null)}
 else if(j.phase=='board'||j.phase=='end'){hide3D();target=$('app');board(j.phase=='end')}
 else{$('quiz-modal').style.display='none';gameActive=true}};

function joinView(k){target=$('app');target.innerHTML=`<h1>Kuis Diskon Detektif 3D</h1><div class=card><input id=n placeholder="Nama lengkap" autocomplete=off><input id=k2 placeholder="Kelas, contoh X-1"><input id=c placeholder="Kode sesi" inputmode=numeric value="${esc(k)}"><button id=go style="width:100%">Gabung ke Desa 3D</button></div>`;
 $('go').onclick=async()=>{try{const j=await api('join',{nama:$('n').value,kelas:$('k2').value,kode:$('c').value});S={pid:j.pid,mode:j.mode,total:j.total,nama:j.nama,i:0};save();key='';setup3D()}catch(e){err(e)}}}
async function home(){const k=new URLSearchParams(location.search).get('kode')||'';if(S.pid){try{await api('lb',{pid:S.pid});return setup3D()}catch(e){localStorage.removeItem('kuis');S={}}}joinView(k)}

/* ===== CORE 3D ENGINE ===== */
let scene,camera,renderer,rendererCanvas,player;
let bots=[],questionBoxes=[];
let gameActive=false,inMenu=true,activeBox=null;
const keys={w:false,a:false,s:false,d:false,ArrowUp:false,ArrowLeft:false,ArrowDown:false,ArrowRight:false};
let joy={x:0,y:0};const isTouch='ontouchstart' in window||navigator.maxTouchPoints>0;
let isMouseDown=false,prevMouse={x:0,y:0},cameraAngle={theta:0,phi:Math.PI/3},cameraRadius=20;
const skins=[
  {name:"Warga",head:0xFFD700,torso:0x2196F3,leg:0x4CAF50,type:'warga'},
  {name:"Petani",head:0xFFCC80,torso:0x8D6E63,leg:0x3E2723,type:'petani'},
  {name:"Detektif",head:0xFFE0B2,torso:0x5D4037,leg:0x1F1009,type:'detektif'}
];
let currentSkinIndex=0;

function createCharacter(skin){
  const g=new THREE.Group(),bw=new THREE.Group(),m=c=>new THREE.MeshLambertMaterial({color:c});
  const bx=(w,h,d,c,x,y,z)=>{const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m(c));o.position.set(x,y,z);o.castShadow=true;bw.add(o);return o};
  bx(1.2,1.2,1.2,skin.head,0,3.6,0);bx(2,2,1,skin.torso,0,2,0);
  const leftArm=bx(.8,2,.8,skin.head,-1.6,2,0),rightArm=bx(.8,2,.8,skin.head,1.6,2,0);
  const leftLeg=bx(.9,2,.9,skin.leg,-.5,0,0),rightLeg=bx(.9,2,.9,skin.leg,.5,0,0);
  bw.position.y=1;g.add(bw);
  return{group:g,leftLeg,rightLeg,leftArm,rightArm,animTime:0};
}

function updatePlayerSkin(){
  const old=player?player.group.position.clone():new THREE.Vector3(0,0,0);
  if(player)scene.remove(player.group);
  player=createCharacter(skins[currentSkinIndex]);player.group.position.copy(old);scene.add(player.group);
}
window.changeSkin=d=>{currentSkinIndex=(currentSkinIndex+d+skins.length)%skins.length;$('skin-name').innerText=skins[currentSkinIndex].name;updatePlayerSkin()};

function setup3D(){
  $('app').style.display='none';$('game-ui').style.display='block';target=$('quiz-modal-content');
  if(!scene)init3D();
  if(rendererCanvas)rendererCanvas.style.display='block';
  $('start-screen').style.display='flex';$('controls-hint').style.display='none';$('quiz-modal').style.display='none';
}
function hide3D(){$('game-ui').style.display='none';$('app').style.display='block';if(rendererCanvas)rendererCanvas.style.display='none'}

let updateCamera=function(){
  if(!player)return;const tgt=player.group.position.clone();
  if(inMenu){tgt.y+=2.5;camera.position.lerp(new THREE.Vector3(tgt.x,tgt.y,tgt.z+8),.1);camera.lookAt(tgt)}
  else{tgt.y+=2;camera.position.lerp(new THREE.Vector3(tgt.x+cameraRadius*Math.sin(cameraAngle.phi)*Math.sin(cameraAngle.theta),tgt.y+cameraRadius*Math.cos(cameraAngle.phi),tgt.z+cameraRadius*Math.sin(cameraAngle.phi)*Math.cos(cameraAngle.theta)),.2);camera.lookAt(tgt)}
};

let init3D=function(){
  scene=new THREE.Scene();scene.background=new THREE.Color(0x87CEEB);scene.fog=new THREE.Fog(0x87CEEB,40,160);
  camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,350);
  renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;
  rendererCanvas=renderer.domElement;Object.assign(rendererCanvas.style,{position:'fixed',top:'0',left:'0',zIndex:'1',touchAction:'none'});
  document.body.appendChild(rendererCanvas);
  scene.add(new THREE.AmbientLight(0xffffff,.7));
  const dl=new THREE.DirectionalLight(0xffffff,.75);dl.position.set(50,100,50);dl.castShadow=true;scene.add(dl);
  const gr=new THREE.Mesh(new THREE.PlaneGeometry(320,320),new THREE.MeshLambertMaterial({color:0x7CB342}));gr.rotation.x=-Math.PI/2;gr.receiveShadow=true;scene.add(gr);
  updatePlayerSkin();
  for(let i=0;i<15;i++){let bx,bz;do{bx=(Math.random()-.5)*120;bz=(Math.random()-.5)*120}while(Math.abs(bx)<22&&Math.abs(bz)<22);
    const bg=new THREE.Group(),m=c=>new THREE.MeshLambertMaterial({color:c});
    const p1=new THREE.Mesh(new THREE.BoxGeometry(.2,3,.2),m(0x5D4037));p1.position.set(-1.5,1.5,0);bg.add(p1);
    const p2=new THREE.Mesh(new THREE.BoxGeometry(.2,3,.2),m(0x5D4037));p2.position.set(1.5,1.5,0);bg.add(p2);
    const bd=new THREE.Mesh(new THREE.BoxGeometry(4,2.5,.3),m(0xFFE082));bd.position.set(0,3,0);bg.add(bd);
    const ind=new THREE.Mesh(new THREE.BoxGeometry(.8,.8,.8),new THREE.MeshLambertMaterial({color:0xFFD700,emissive:0xAA6600}));ind.position.set(0,5,0);bg.add(ind);
    bg.position.set(bx,0,bz);scene.add(bg);questionBoxes.push({mesh:bg,indicator:ind,active:true,time:Math.random()*100})}
  addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
  document.addEventListener('keydown',e=>{if(e.key in keys)keys[e.key]=true});
  document.addEventListener('keyup',e=>{if(e.key in keys)keys[e.key]=false});
  const mc=(dx,dy)=>{cameraAngle.theta-=dx*.01;cameraAngle.phi=Math.max(.1,Math.min(Math.PI/2-.1,cameraAngle.phi-dy*.01))};
  rendererCanvas.addEventListener('mousedown',()=>isMouseDown=true);
  rendererCanvas.addEventListener('mouseup',()=>isMouseDown=false);
  rendererCanvas.addEventListener('mousemove',e=>{if(isMouseDown&&gameActive)mc(e.movementX,e.movementY)});
  rendererCanvas.addEventListener('touchstart',e=>{isMouseDown=true;prevMouse={x:e.changedTouches[0].clientX,y:e.changedTouches[0].clientY}},{passive:false});
  rendererCanvas.addEventListener('touchend',()=>isMouseDown=false);
  rendererCanvas.addEventListener('touchmove',e=>{if(isMouseDown&&gameActive){const t=e.changedTouches[0];mc(t.clientX-prevMouse.x,t.clientY-prevMouse.y);prevMouse={x:t.clientX,y:t.clientY}}},{passive:false});
  const el=$('joy'),k=$('joyk'),R=40;let id=null;
  const mv=e=>{const r=el.getBoundingClientRect();let dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);const d=Math.hypot(dx,dy);if(d>R){dx*=R/d;dy*=R/d}joy.x=dx/R;joy.y=dy/R;k.style.transform=`translate(${dx}px,${dy}px)`};
  const end=()=>{id=null;joy.x=joy.y=0;k.style.transform='translate(0,0)'};
  el.addEventListener('pointerdown',e=>{id=e.pointerId;el.setPointerCapture(id);mv(e)});el.addEventListener('pointermove',e=>{if(e.pointerId===id)mv(e)});el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
  (function anim(){requestAnimationFrame(anim);
    if(gameActive&&player){const fv=new THREE.Vector3(-Math.sin(cameraAngle.theta),0,-Math.cos(cameraAngle.theta)).normalize(),rv2=new THREE.Vector3(Math.cos(cameraAngle.theta),0,-Math.sin(cameraAngle.theta)).normalize(),md=new THREE.Vector3();let mv2=false;
      if(keys.w||keys.ArrowUp){md.add(fv);mv2=true}if(keys.s||keys.ArrowDown){md.sub(fv);mv2=true}if(keys.a||keys.ArrowLeft){md.sub(rv2);mv2=true}if(keys.d||keys.ArrowRight){md.add(rv2);mv2=true}
      if(Math.abs(joy.x)>.15||Math.abs(joy.y)>.15){md.addScaledVector(fv,-joy.y);md.addScaledVector(rv2,joy.x);mv2=true}
      if(mv2){md.normalize();player.group.position.addScaledVector(md,.32);let df=Math.atan2(md.x,md.z)-player.group.rotation.y;while(df>Math.PI)df-=2*Math.PI;while(df<-Math.PI)df+=2*Math.PI;player.group.rotation.y+=df*.2;player.animTime+=.25;const s=Math.sin(player.animTime)*.8;player.leftLeg.rotation.x=s;player.rightLeg.rotation.x=-s;player.leftArm.rotation.x=-s;player.rightArm.rotation.x=s}
      else{player.leftLeg.rotation.x*=.8;player.rightLeg.rotation.x*=.8;player.leftArm.rotation.x*=.8;player.rightArm.rotation.x*=.8}
      player.group.position.x=Math.max(-145,Math.min(145,player.group.position.x));player.group.position.z=Math.max(-145,Math.min(145,player.group.position.z));
      questionBoxes.forEach(qb=>{if(qb.active){qb.time+=.05;qb.indicator.position.y=4.8+Math.sin(qb.time)*.3;qb.indicator.rotation.y+=.05;if(player.group.position.distanceTo(qb.mesh.position)<3.5&&S.mode!='live'){joy.x=joy.y=0;activeBox=qb;mandiri('umum')}}})}
    updateCamera();renderer.render(scene,camera)})();
};

window.startGame=function(){
  $('start-screen').style.display='none';$('controls-hint').style.display='block';inMenu=false;gameActive=true;
  if(S.mode=='live')live();if(isTouch){$('joy').style.display='block';$('controls-hint').style.display='none'}
};

function csv(t){t=t.replace(/^\uFEFF/,'');const h=t.split(/\r?\n/)[0],d=h.includes('\t')?'\t':h.includes(',')?',':';',r=[];let row=[],c='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}else if(ch=='"')q=true;else if(ch==d){row.push(c);c=''}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;row.push(c);r.push(row);row=[];c=''}else c+=ch}row.push(c);r.push(row);return r.filter(x=>x.join('').trim())}

 let EI=-1;const openEd=i=>{EI=i;const x=i<0?{q:'',o:['','','',''],k:'A',d:30,p:100,x:'',g:'',t:'pg'}:Q[i];f('q').value=x.q;f('t').value=x.t;['a','b','c','d'].forEach((l,n)=>f(l).value=x.o[n]||'');fillK(x.t,x.k);f('s').value=x.d;f('p').value=x.p;f('g').value=x.g;f('x').value=x.x;$('ed').style.display='block'};
 f('t').onchange=()=>fillK(f('t').value,'A');$('ec').onclick=()=>$('ed').style.display='none';$('ad').onclick=()=>openEd(-1);
